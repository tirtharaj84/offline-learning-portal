# Generated into runtime/nginx/conf/portal.conf by Install-Portal.ps1
worker_processes 1;
daemon off;
events { worker_connections 256; }
http {
    include mime.types;
    default_type application/octet-stream;
    access_log logs/portal-access.log;
    error_log logs/portal-error.log;
    sendfile on;
    server {
        listen __PORT__;
        server_name __HOSTNAME__ localhost 127.0.0.1;
        root __WEB_ROOT__;
        index index.html;
        location / { try_files $uri $uri/ =404; }
        # Keep metadata sidecars and hidden files out of browser delivery.
        location ~ (^|/)\. { deny all; }
        location ~* \.meta\.json$ { deny all; }
    }
}
